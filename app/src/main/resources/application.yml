server:
  port: 8080

spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:h2:mem:permdemo;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true

demo:
  opa-url: ${OPA_URL:http://localhost:8181}
  elasticsearch-url: ${ELASTICSEARCH_URL:http://localhost:9200}
  team-directory-cache-ttl-seconds: 60

logging:
  level:
    com.example.permdemo: INFO
    audit.partial_eval: INFO
